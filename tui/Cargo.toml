[package]
name = "fsoc"
version = "0.1.0"
edition = "2021"
description = "A terminal-native Linux wargame that is a game, simulator and teacher at once"

[[bin]]
name = "fsoc"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
portable-pty = "0.8"
vt100 = "0.15"

[profile.release]
opt-level = 2

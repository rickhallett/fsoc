[package]
name = "wargamezr"
version = "0.1.0"
edition = "2021"
description = "A terminal-native front-end for a self-hosted Bandit-style Linux wargame"

[[bin]]
name = "wargamezr"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
anyhow = "1"

[profile.release]
opt-level = 2
